# Entrada de producción: sirve la aplicación real (ingreso de la médica por
# enlace de correo y del paciente por código SMS) sobre D1 y R2.
name = "recetas-medicas"
main = "src/server/index.ts"
compatibility_date = "2026-10-19"

# Recursos creados por la médica el 19 de octubre de 2026.
[[d1_databases]]
binding = "DB"
database_name = "dranallim"
database_id = "2f0372ff-8366-419e-bf10-23edef40baf2"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "recetas"

[vars]
# Origen público del portal. Debe coincidir con el dominio desplegado: la
# aplicación sólo acepta escrituras con este origen.
PORTAL_ORIGIN = "https://recetas-medicas.dranallim.workers.dev"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
# La API siempre llega al Worker, incluso al navegar directamente.
run_worker_first = ["/api", "/api/*"]

# Registros de invocación en Cloudflare. Sirven para diagnosticar fallos de
# entrega o de configuración sin exponer datos clínicos: la aplicación nunca
# registra códigos, DNI, tokens ni cuerpos (ver docs/SEGURIDAD.md).
[observability.logs]
enabled = true
invocation_logs = true
persist = true

[dev]
ip = "127.0.0.1"
